<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      /* children selector */
      div>h1 {
        /* we can write div>hi ad h1 is direct child of div */
        color: red;
      }
    </style>
  </head>

  <body>
    <!-- select "I'm the direct son" and make it blue -->

    <div>
      <h1>
        <!-- h1 is the direct child of div -->
        <span>I'm the direct son</span>
      </h1>
    </div>

    <div>
      <span>
        <h1>
          <!-- hi is not the direct child of div -->
          <span>I'm the indirect son</span>
        </h1>
      </span>
    </div>
  </body>
</html>
