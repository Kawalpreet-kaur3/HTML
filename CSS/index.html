<!doctype html>
<!--showing document type is html -->
<!-- latest version is html5 -->
<html lang="en">
  <!--actual html code starts, language="english"-->
  <!-- html document is divied into two parts: head and body -->
  <head>
    <!-- things we don't want to show to user:cs/javascript file, images google form-->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>first cs file</title>
    <!-- name shows on tab of the website-->

    <link rel="stylesheet" href="styles.css" />
    <!-- for external css file-->

    <style>
      /* used to add CSS */
      h1 {
        color: blue; /* ctrl + space , used to add text color*/
        background-color: yellow; /*used to add text`s background color*/
      }

      h2 {
        color: teal;
        background-color: rgba(202, 181, 154, 0.697);
      }
    </style>

  </head>
  <body>
    <!-- create whatever we want: list,forms,tables -->
    <h1 style="color: darkgreen; background-color: darkseagreen">
      I am Heading 1
    </h1>
    <h2>I am Heading 1</h2>
    <h3 style="color: pink; background-color: black">I am Heading 1</h3>
    <h4>I am Heading 1</h4>
  </body>
</html>
